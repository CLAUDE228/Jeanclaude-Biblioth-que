{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Jeanclaude Bibliothèque</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'bibliotheque/css/style.css' %}" rel="stylesheet">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a href="{% url 'accueil' %}" class="text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Accueil</a>
            <div class="text-center my-4">
                <span class="brand-mark mx-auto"><i class="bi bi-book-half"></i></span>
                <h1 class="h3 mt-3 mb-1">Bienvenue</h1>
                <p class="text-secondary small mb-0">Connectez-vous à votre bibliothèque.</p>
            </div>
            {% if form.errors %}<div class="alert alert-danger" role="alert">Identifiant ou mot de passe incorrect.</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Identifiant</label>
                    <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Mot de passe</label>
                    <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Se connecter</button>
            </form>
        </section>
    </main>
</body>
</html>
